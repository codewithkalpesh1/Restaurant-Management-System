<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Cozy Corner</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Admin CSS -->
    <link rel="stylesheet" href="admin.css">
</head>

<body class="login-page">

    <!-- Back to Website -->
    <a class="back-site" href="index.html">

        <i class="fa fa-arrow-left"></i>
        Back to Website

    </a>

    <!-- Login Card -->
    <main class="login-card">

        <!-- Login Icon -->
        <div class="login-icon">

            <i class="fa-solid fa-utensils"></i>

        </div>

        <!-- Login Heading -->
        <p class="kicker">
            COZY CORNER
        </p>

        <h1>
            Admin Login
        </h1>

        <p class="muted">
            Sign in to manage your restaurant
        </p>

        <!-- Login Form -->
        <form id="loginForm">

            <label>Email Address</label>

            <input
                class="form-control"
                type="email"
                id="email"
                required
                placeholder="admin@cozycorner.com"
            >

            <label>Password</label>

            <input
                class="form-control"
                type="password"
                id="password"
                required
                minlength="6"
                placeholder="Enter password"
            >

            <!-- Login Error Message -->
            <p class="login-error" id="loginError"></p>

            <!-- Login Button -->
            <button class="admin-btn w-100" type="submit">

                Login to Dashboard

                <i class="fa fa-arrow-right"></i>

            </button>

        </form>

        <!-- Demo Login Details -->
        <div class="demo-note">

            <b>Demo Login</b>
            <br>

            Email: admin@cozycorner.com
            <br>

            Password: admin123

        </div>

    </main>

    <!-- Custom JavaScript -->
    <script src="admin.js"></script>

</body>

</html>
